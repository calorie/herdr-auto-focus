id = "calorie.herdr-auto-focus"
name = "Herdr Auto Focus"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Focus agents that need attention after system input becomes idle."
platforms = ["macos"]

[[build]]
command = ["go", "build", "-trimpath", "-o", "bin/herdr-auto-focus", "./cmd/herdr-auto-focus"]

[[events]]
on = "pane.agent_status_changed"
command = ["bin/herdr-auto-focus"]
